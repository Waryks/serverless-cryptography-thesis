# Test configuration for validation-lambda
# LocalStack endpoint override
quarkus.sqs.endpoint-override=http://localhost:4566
quarkus.secretsmanager.endpoint-override=http://localhost:4566
quarkus.dynamodb.endpoint-override=http://localhost:4566

# Region
quarkus.sqs.aws.region=eu-central-1
quarkus.secretsmanager.aws.region=eu-central-1
quarkus.dynamodb.aws.region=eu-central-1

# Index commons module for Quarkus / GraalVM reflection discovery
quarkus.index-dependency.commons.group-id=com.alexthesis
quarkus.index-dependency.commons.artifact-id=commons

# AWS SQS queue configuration
thesis.sqs.ingress-queue-name=thesis-ingress-events
thesis.sqs.accepted-queue-name=thesis-accepted-events
thesis.sqs.rejected-queue-name=thesis-rejected-events

# DynamoDB dedup table
thesis.dynamodb.dedup-table=thesis-dedup
thesis.dynamodb.dedup-ttl-seconds=86400

# Validation security configuration
thesis.security.replay-check-enabled=true
thesis.security.replay-window-ms=300000
thesis.security.dedup-enabled=true

# Caching experiment: 0 (no cache) vs 60 (cache)
thesis.keys.cache.ttlSeconds=0

# Policy engine configuration
thesis.policy.default=strict-rsa
thesis.policy.algorithm.HMAC_SHA256=relaxed-hmac
thesis.policy.algorithm.RSA_PSS_SHA256=strict-rsa
thesis.policy.algorithm.ECDSA_P256_SHA256=strict-ecdsa

thesis.policy.strict-rsa.algorithm=RSA_PSS_SHA256
thesis.policy.strict-rsa.replay-enabled=true
thesis.policy.strict-rsa.replay-window-ms=300000
thesis.policy.strict-rsa.dedup-enabled=true
thesis.policy.strict-rsa.allow-previous-key=false
thesis.policy.strict-rsa.strict-validation=true

thesis.policy.relaxed-hmac.algorithm=HMAC_SHA256
thesis.policy.relaxed-hmac.replay-enabled=false
thesis.policy.relaxed-hmac.replay-window-ms=300000
thesis.policy.relaxed-hmac.dedup-enabled=false
thesis.policy.relaxed-hmac.allow-previous-key=true
thesis.policy.relaxed-hmac.strict-validation=false

thesis.policy.strict-ecdsa.algorithm=ECDSA_P256_SHA256
thesis.policy.strict-ecdsa.replay-enabled=true
thesis.policy.strict-ecdsa.replay-window-ms=300000
thesis.policy.strict-ecdsa.dedup-enabled=true
thesis.policy.strict-ecdsa.allow-previous-key=false
thesis.policy.strict-ecdsa.strict-validation=true


