# Story 14: Enhanced Experiment Configuration
# This YAML file demonstrates all configurable options available for experiments
# Including algorithms, payload sizes, cache modes, rotation modes, replay/dedup options, cold/warm modes

# Configuration schema:
#   name: unique experiment identifier
#   description: human-readable description
#   scenario: accepted, rejected, replay, duplicate, expired
#   algorithm: HMAC_SHA256, RSA_PSS_SHA256, ECDSA_P256_SHA256
#   payload_size: small, medium, large
#   iterations: number of times to execute
#   expected_outcome: ACCEPTED, REJECTED
#   cold_start_mode: none, per_iteration, per_experiment, idle_wait
#   cache_enabled: true/false - enable secret/key caching
#   rotation_mode: current_only, current_and_previous
#   replay_enabled: true/false - enable replay protection
#   dedup_enabled: true/false - enable deduplication
#   execution_mode: sequential, concurrent
#   completion_timeout_seconds: max wait for Lambda completion
#   poll_seconds: polling interval for ledger/audit checks
#   replay_window_ms: time window for replay detection (5 min default)

experiments:
  # ==========================================
  # Baseline Accepted Flow - Cold Start Tests
  # ==========================================
  - name: baseline_hmac_cold
    description: "HMAC baseline with cold start per iteration"
    scenario: accepted
    algorithm: HMAC_SHA256
    payload_size: small
    iterations: 5
    expected_outcome: ACCEPTED
    cold_start_mode: per_iteration
    cache_enabled: false
    rotation_mode: current_only
    replay_enabled: true
    dedup_enabled: true
    execution_mode: sequential
    completion_timeout_seconds: 8.0
    poll_seconds: 0.25

  - name: baseline_rsa_cold
