# Benchmark Experiment Configuration
# This YAML file defines all benchmark experiments for Story 12 implementation
# Each experiment orchestrates a specific test scenario with configurable parameters

experiments:
  # ==========================================
  # Baseline Accepted Flow - Cold Start Tests
  # ==========================================
  - name: baseline_hmac_cold
    scenario: accepted
    algorithm: HMAC_SHA256
    payload_size: small
    policy_mode: default
    iterations: 5
    expected_outcome: ACCEPTED
    cold_start_mode: per_iteration
    wait_for_completion: true
    completion_timeout_seconds: 8.0
    poll_seconds: 0.25

  - name: baseline_rsa_cold
    scenario: accepted
    algorithm: RSA_PSS_SHA256
    payload_size: small
    policy_mode: default
    iterations: 5
    expected_outcome: ACCEPTED
    cold_start_mode: per_iteration
    wait_for_completion: true
    completion_timeout_seconds: 8.0
    poll_seconds: 0.25

  - name: baseline_ecdsa_cold
    scenario: accepted
    algorithm: ECDSA_P256_SHA256
    payload_size: small
    policy_mode: default
    iterations: 5
    expected_outcome: ACCEPTED
    cold_start_mode: per_iteration
    wait_for_completion: true
    completion_timeout_seconds: 8.0
    poll_seconds: 0.25

  # ==========================================
  # Warm Invocation Tests (No Cold Start)
  # ==========================================
  - name: warm_hmac_50
    scenario: accepted
    algorithm: HMAC_SHA256
    payload_size: small
    policy_mode: default
    iterations: 50
    expected_outcome: ACCEPTED
    cold_start_mode: none
    wait_for_completion: false
    completion_timeout_seconds: 8.0
    poll_seconds: 0.25

  - name: warm_rsa_50
    scenario: accepted
    algorithm: RSA_PSS_SHA256
    payload_size: small
    policy_mode: default
