    iterations: 50
    expected_outcome: ACCEPTED
    cold_start_mode: none
    wait_for_completion: false
    completion_timeout_seconds: 8.0
    poll_seconds: 0.25

  # ==========================================
  # Payload Size Variation Tests
  # ==========================================
  - name: payload_hmac_small
    scenario: accepted
    algorithm: HMAC_SHA256
    payload_size: small
    policy_mode: default
    iterations: 10
    expected_outcome: ACCEPTED
    cold_start_mode: none
    wait_for_completion: true
    completion_timeout_seconds: 8.0
    poll_seconds: 0.25

  - name: payload_hmac_medium
    scenario: accepted
    algorithm: HMAC_SHA256
    payload_size: medium
    policy_mode: default
    iterations: 10
    expected_outcome: ACCEPTED
    cold_start_mode: none
