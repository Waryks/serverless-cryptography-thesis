  # ==========================================
  # Replay Protection Tests
  # ==========================================
  - name: replay_hmac
    scenario: replay
    algorithm: HMAC_SHA256
    payload_size: small
    policy_mode: default
    iterations: 3
    expected_outcome: REJECTED
    replay_window_ms: 300000
    wait_for_completion: true
    completion_timeout_seconds: 8.0
